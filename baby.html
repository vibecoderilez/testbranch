<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Feeding Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .korean-text {
            font-size: 2em;
            color: #555;
            margin-bottom: 30px;
        }
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 30px 0;
        }
        .baby-container {
            position: relative;
            width: 300px;
            height: 300px;
            background-color: #e6f3ff;
            border-radius: 15px;
            margin: 20px 0;
            overflow: hidden;
            border: 3px solid #4CAF50;
        }
        .baby {
            position: absolute;
            font-size: 80px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease;
            z-index: 10;
        }
        .food-animation {
            position: absolute;
            font-size: 50px;
            z-index: 5;
            animation: flyToBaby 1.5s forwards;
        }
        @keyframes flyToBaby {
            0% { 
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            50% { 
                transform: translate(var(--target-x-half), var(--target-y-half)) scale(1.2);
                opacity: 0.8;
            }
            100% { 
                transform: translate(var(--target-x), var(--target-y)) scale(0.5);
                opacity: 0;
            }
        }
        @keyframes eating {
            0% { transform: translate(-50%, -50%) scale(1); }
            25% { transform: translate(-50%, -50%) scale(1.2); }
            50% { transform: translate(-50%, -50%) scale(0.8); }
            75% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes bubble {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        }
        .bubble {
            position: absolute;
            font-size: 30px;
            z-index: 15;
            animation: bubble 1.5s forwards;
        }
        .controls {
            margin: 20px 0;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 10px 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .status {
            margin-top: 15px;
            font-size: 1.2em;
            color: #2c3e50;
            min-height: 30px;
        }
        .food-counter {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
        }
        .counter {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            min-width: 120px;
        }
        .counter-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #e74c3c;
        }
        .counter-label {
            font-size: 0.9em;
            color: #7f8c8d;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            background-color: #fff8e1;
            color: #5d4037;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>I want to put a baby in you</h1>
        <div class="korean-text">나는 너 안에 아기를 넣고 싶어</div>
        
        <div class="food-counter">
            <div class="counter">
                <div class="counter-value" id="phoCount">0</div>
                <div class="counter-label">Pho Fed</div>
            </div>
            <div class="counter">
                <div class="counter-value" id="sushiCount">0</div>
                <div class="counter-label">Sushi Fed</div>
            </div>
        </div>
        
        <div class="game-area">
            <div class="baby-container" id="babyContainer">
                <div class="baby" id="baby">👶</div>
            </div>
            
            <div class="controls">
                <button onclick="feedFood('pho')">Feed Pho 🍜</button>
                <button onclick="feedFood('sushi')">Feed Sushi 🍣</button>
            </div>
            
            <div class="status" id="status">Ready to feed!</div>
            <div class="message" id="message"></div>
        </div>
    </div>

    <script>
        const baby = document.getElementById('baby');
        const babyContainer = document.getElementById('babyContainer');
        const statusDiv = document.getElementById('status');
        const messageDiv = document.getElementById('message');
        const phoCountElement = document.getElementById('phoCount');
        const sushiCountElement = document.getElementById('sushiCount');
        
        let phoCount = 0;
        let sushiCount = 0;
        
        function feedFood(foodType) {
            // Disable buttons during animation
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => btn.disabled = true);
            
            // Create food element
            const food = document.createElement('div');
            food.className = 'food-animation';
            food.textContent = foodType === 'pho' ? '🍜' : '🍣';
            
            // Position food at bottom of container
            food.style.left = '50%';
            food.style.top = '100%';
            food.style.transform = 'translateX(-50%)';
            
            babyContainer.appendChild(food);
            
            // Calculate target positions
            const babyRect = baby.getBoundingClientRect();
            const containerRect = babyContainer.getBoundingClientRect();
            
            const targetX = (babyRect.left - containerRect.left) - (containerRect.width / 2) + (babyRect.width / 2);
            const targetY = (babyRect.top - containerRect.top) - (containerRect.height / 2) + (babyRect.height / 2);
            
            const targetXHalf = targetX * 0.5;
            const targetYHalf = targetY * 0.5;
            
            // Set CSS variables for animation
            food.style.setProperty('--target-x', `${targetX}px`);
            food.style.setProperty('--target-y', `${targetY}px`);
            food.style.setProperty('--target-x-half', `${targetXHalf}px`);
            food.style.setProperty('--target-y-half', `${targetYHalf}px`);
            
            // Update counters
            if (foodType === 'pho') {
                phoCount++;
                phoCountElement.textContent = phoCount;
                statusDiv.textContent = "Feeding pho to the baby...";
            } else {
                sushiCount++;
                sushiCountElement.textContent = sushiCount;
                statusDiv.textContent = "Feeding sushi to the baby...";
            }
            
            // Show message
            messageDiv.textContent = `The baby is enjoying ${foodType}!`;
            messageDiv.style.display = 'block';
            
            // Animation sequence
            setTimeout(() => {
                // Food reaches baby - make baby eat
                baby.style.animation = 'eating 0.8s ease-in-out';
                
                // Create bubble effect
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.textContent = foodType === 'pho' ? '😋' : '😍';
                bubble.style.left = '50%';
                bubble.style.top = '50%';
                babyContainer.appendChild(bubble);
                
                // Change baby expression while eating
                const originalBaby = baby.textContent;
                baby.textContent = foodType === 'pho' ? '😋' : '😍';
                
                setTimeout(() => {
                    // Reset animations
                    baby.style.animation = '';
                    baby.textContent = originalBaby;
                    
                    // Remove food and bubble
                    food.remove();
                    bubble.remove();
                    
                    // Show appreciation message
                    messageDiv.textContent = `The baby loved ${foodType}!`;
                    
                    // Re-enable buttons
                    buttons.forEach(btn => btn.disabled = false);
                    
                    // Update status
                    statusDiv.textContent = "Baby is happy!";
                    
                    // Hide message after delay
                    setTimeout(() => {
                        messageDiv.style.display = 'none';
                    }, 2000);
                }, 800);
            }, 1500);
        }
        
        // Add random baby expressions periodically
        setInterval(() => {
            if (Math.random() > 0.7) { // 30% chance every few seconds
                const expressions = ['😊', '😄', '😇', '🥰', '👶'];
                const randomExpression = expressions[Math.floor(Math.random() * expressions.length)];
                const originalBaby = baby.textContent;
                
                baby.textContent = randomExpression;
                setTimeout(() => {
                    baby.textContent = originalBaby;
                }, 800);
            }
        }, 3000);
    </script>
</body>
</html>
